<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Link Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="app-icon" src="icons/48.png" width="24" height="24" alt="">
    <h1 lang="en">Claude Link Helper</h1>
  </header>
  <main>
    <p class="instruction">打开登录邮件，在正文旁复制链接。</p>
    <button id="scan" type="button">检测当前页面</button>
    <p id="status" role="status" aria-live="polite">未出现复制按钮时，可手动检测。</p>
    <details>
      <summary>使用说明<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg></summary>
      <div class="help">
        <p>自动检测 Gmail、Outlook、Proton、Tuta、Zoho、Yahoo、Fastmail、QQ 和网易邮箱。</p>
        <p>其他邮箱可手动检测。请先展开正文；受限的内嵌邮件可能无法读取。</p>
        <p>找到多个链接或无法验证时，复制按钮会停用。</p>
      </div>
    </details>
  </main>
  <footer>邮件和链接仅在本地处理。</footer>
  <script src="popup.js"></script>
</body>
</html>
