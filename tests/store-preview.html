<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link Helper for Claude — 商店素材</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:800px;overflow:hidden;background:#f5f5f2;color:#141413;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}.page{padding:42px 54px;height:100%;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600}.brand img{width:34px;height:34px}.brand small{margin-left:auto;font-size:12px;font-weight:400;color:#6c6c66}h1{margin:24px 0 8px;font-size:34px;line-height:1.3;letter-spacing:-.8px;font-weight:600}.intro{margin:0 0 24px;font-size:16px;color:#6c6c66}.layout{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:26px;align-items:start;flex:1}.mail-shell{border:1px solid #deded7;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 8px 24px #14141308}.bar{display:flex;gap:6px;height:28px;align-items:center;padding:0 14px;border-bottom:1px solid #eee;background:#fbfbfa}.bar i{width:6px;height:6px;background:#d5d5cf;border-radius:50%}iframe{display:block;border:0;width:100%;background:#fff}#mail{height:472px}#popup{height:340px;border:1px solid #e2e2dc;border-radius:8px;box-shadow:0 8px 24px #1414130c}.feature{margin-top:20px;padding:0 3px;font-size:14px;line-height:1.8;color:#62625b}.feature strong{display:block;color:#292723;font-weight:500;margin-bottom:3px}.foot{display:flex;justify-content:space-between;font-size:12px;color:#77776e;padding-top:18px}.inline .layout{display:block}.inline .mail-shell{width:100%}.inline #mail{height:472px}.inline .aside{display:none}.promo, .promo body{width:440px;height:280px;background:#141413;color:#faf9f5}.promo .page{padding:30px 34px}.promo .brand{gap:13px;align-items:flex-start;font-size:27px;line-height:1.2}.promo .brand img{width:44px;height:44px}.promo .brand small,.promo .layout,.promo .intro{display:none}.promo h1{font-size:21px;letter-spacing:0;line-height:1.5;margin:32px 0 0;font-weight:400}.promo .foot{margin-top:auto;color:#b0aea5;font-size:12px;padding:0}.promo .foot span:last-child{display:none}.control{display:none!important}
</style></head><body><main class="page">
<div class="brand"><img src="/extension/icons/128.png" alt=""><span>Link Helper for Claude</span><small>独立开发的非官方扩展</small></div>
<h1 id="headline">在邮件里，一键复制登录链接</h1><p class="intro" id="intro">识别 Sign in 按钮对应的链接，复制前再次校验。</p>
<div class="layout"><div class="mail-shell"><div class="bar"><i></i><i></i><i></i></div><iframe id="mail" title="示例邮件"></iframe></div><div class="aside"><iframe id="popup" title="扩展弹窗" src="/extension/popup.html"></iframe><div class="feature"><strong>找不到正文里的按钮？</strong>手动检测后，在弹窗直接复制。<br>多个链接或无法验证时明确提示。</div></div></div>
<div class="foot"><span>仅本地处理，不上传邮件或登录链接</span><span>示例邮件，使用虚构凭据</span></div>
<div class="control"><button id="one"></button><button id="many"></button><button id="change"></button><textarea id="paste"></textarea><p id="fixture-status"></p></div>
</main><script src="/tests/store-preview.js"></script></body></html>
